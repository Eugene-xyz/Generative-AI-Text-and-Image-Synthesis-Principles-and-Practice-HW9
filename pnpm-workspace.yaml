nodeLinker: hoisted
enableGlobalVirtualStore: false
storeDir: .pnpm-store
allowBuilds:
  sharp: true

# astro2tsx uses emnapi core 1.11.3; its unconstrained transitive peer can select
# an incompatible 2.x beta. Supply the matching runtime at that package boundary.
packageExtensions:
  '@astrojs/astro2tsx@0.1.3':
    dependencies:
      '@emnapi/runtime': 1.11.3
